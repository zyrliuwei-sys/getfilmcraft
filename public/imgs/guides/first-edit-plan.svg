<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">A 30-second first edit</title>
  <desc id="desc">An illustrative timeline: opening from zero to eight seconds, action until twenty-two seconds, then a result until thirty seconds, with a title over the opening.</desc>
  <rect width="1200" height="750" fill="#f6f2e9"/>
  <g font-family="Arial, sans-serif" fill="#302a24">
    <text x="64" y="73" font-size="16" letter-spacing="3" fill="#835832">THE EDITING DESK / PRACTICE 01</text>
    <text x="64" y="149" font-size="48" font-weight="700">Three shots. One small story.</text>
    <text x="64" y="192" font-size="22" fill="#746a5e">A 30-second exercise, from context to payoff.</text>
    <g stroke="#d5cbbd" stroke-width="2"><path d="M160 265V570M428 265V570M897 265V570M1164 265V570"/></g>
    <g font-family="monospace" font-size="19" fill="#746a5e"><text x="160" y="249">00:00</text><text x="428" y="249">00:08</text><text x="897" y="249">00:22</text><text x="1095" y="249">00:30</text></g>
    <text x="64" y="320" font-size="16">TITLE</text><text x="64" y="430" font-size="16">VIDEO</text><text x="64" y="540" font-size="16">AUDIO</text>
    <rect x="161" y="286" width="266" height="62" rx="7" fill="#e4d2b6"/><text x="187" y="325" font-size="21">A short introduction</text>
    <rect x="161" y="374" width="266" height="107" rx="7" fill="#475b60"/><rect x="430" y="374" width="464" height="107" rx="7" fill="#697a67"/><rect x="899" y="374" width="264" height="107" rx="7" fill="#986b46"/>
    <g fill="#fff"><text x="187" y="414" font-size="16">01 / OPENING</text><text x="187" y="450" font-size="25">Where are we?</text><text x="456" y="414" font-size="16">02 / ACTION</text><text x="456" y="450" font-size="25">What happens?</text><text x="925" y="414" font-size="16">03 / RESULT</text><text x="925" y="450" font-size="25">The payoff</text></g>
    <rect x="161" y="505" width="1002" height="61" rx="7" fill="#e4e7dc"/><path d="M181 548L215 523H1103L1141 548" fill="none" stroke="#697a67" stroke-width="3"/><text x="482" y="546" font-size="18">Keep useful location sound</text>
    <path d="M64 616H1136" stroke="#c8bdad"/>
    <text x="64" y="664" font-size="23">Watch the whole sequence before polishing individual cuts.</text>
    <text x="64" y="704" font-size="15" fill="#746a5e">ILLUSTRATIVE EDIT PLAN · NOT AN APPLICATION SCREENSHOT</text>
  </g>
</svg>
